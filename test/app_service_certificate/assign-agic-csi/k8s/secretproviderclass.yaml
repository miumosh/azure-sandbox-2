# 方式B: KeyVault の証明書 → K8s TLS Secret に同期する定義。
# terraform output の値で <...> を埋める。
#
# ===========================================================================
# ★ objectName は cert/ の元シークレットではなく、"KV 証明書オブジェクトとして
#   import し直した方" (<CSI_CERT_OBJECT_NAME> = appgw-tls-cert-pem) を指す。
# ===========================================================================
# App Service Certificate は KV に「証明書オブジェクト」を作らず、素のシークレットに
# base64 の PFX を入れるだけ (cert/README.md 参照)。
#
# CSI の Azure プロバイダは「KV 証明書オブジェクト」がある場合にだけ PKCS12 → PEM 変換を
# 行う。素のシークレット (= ASC の appgw-tls-cert) を直接指すと、どう設定しても破綻する:
#
#   objectEncoding 無し(既定 utf-8)
#     → プロバイダが base64 文字列のまま書き出す
#     → CSI ドライバの PKCS12 パースが asn1 エラー
#     → **K8s Secret が黙って生成されない** (Pod は Running のままなので気づきにくい)
#        エラーは kubectl logs -n kube-system -l app=secrets-store-csi-driver -c secrets-store のみ
#
#   objectEncoding: base64 / objectFormat: pem
#     → ファイルはバイナリ PFX になり Secret は生成される。しかし CSI ドライバ側が
#       PKCS12 を解釈するため、Go の pkcs12.ToPEM がバッグ属性を PEM ヘッダとして出力し、
#       tls.crt のリーフがこうなる:
#           -----BEGIN CERTIFICATE-----
#           localKeyId: 01000000        ← OpenSSL は Proc-Type 以外のヘッダを解釈できない
#
#           MIIHnjCCBYag...
#       さらにチェーンが逆順 (ルートが先頭・リーフが最後) になる。
#     → AGIC が tls.crt + tls.key から PFX を作り直す段階で失敗:
#           Code="ErrorExportingWithOpenSSL"
#           "No cert in -in file '/tmp/appgw-ingress-cert...' matches private key"
#
# → 対処: assign-agic-csi/cert_ref.tf の azurerm_key_vault_certificate.pem で
#   同じ PFX を KV 証明書オブジェクトとして import し、こちらを objectName に指す。
#   プロバイダがネイティブに扱うのでクリーンな PEM (リーフ先頭・ヘッダ無し) が得られる。
#
# 【トレードオフ】import はスナップショットのコピー。ASC が更新されても自動追従しない
#   (terraform apply し直しが必要)。方式A は versionless secret id で自動追従する。
# ===========================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: appgw-tls-spc
spec:
  provider: azure
  # ↓ これが kubernetes.io/tls の K8s Secret を生成する (Pod がマウントして初めて生成)
  #   secretName は Ingress の spec.tls.secretName と一致させる (= appgw-tls-cert)
  secretObjects:
    - secretName: appgw-tls-cert
      type: kubernetes.io/tls
      data:
        - objectName: <CSI_CERT_OBJECT_NAME> # KV オブジェクト名 (= ファイル名) と一致必須
          key: tls.key
        - objectName: <CSI_CERT_OBJECT_NAME>
          key: tls.crt
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<CSI_IDENTITY_CLIENT_ID>" # terraform output csi_identity_client_id
    keyvaultName: "<KEYVAULT_NAME>"                    # terraform output keyvault_name
    tenantId: "<TENANT_ID>"                            # terraform output tenant_id
    # objects は「文字列に埋め込まれた YAML」。
    #   objectType: secret … KV 証明書オブジェクトの "backing secret" を読む = 秘密鍵込みの PEM。
    #                        certificate だと公開鍵のみで TLS に使えない。
    #   objectEncoding / objectFormat は不要 (プロバイダが PEM に変換してくれる)。
    objects: |
      array:
        - |
          objectName: <CSI_CERT_OBJECT_NAME>
          objectType: secret
